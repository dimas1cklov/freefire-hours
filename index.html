<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BloxHours – Playtime Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&amp;family=Rajdhani:wght@500;600;700&amp;display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#050506}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#app{width:390px;height:844px;flex:none;transform-origin:center center}
*{-webkit-tap-highlight-color:transparent}
a{color:#FFC21A}a:hover{color:#FFD866}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes ember{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-260px);opacity:0}}
@keyframes stripes{to{background-position:28px 0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:.35}}
.spin{animation:spin 2.4s linear infinite;transform-origin:50% 50%}
.spinr{animation:spinr 3.6s linear infinite;transform-origin:50% 50%}
.pulse{animation:pulse 2s ease-in-out infinite}
.ember{position:absolute;width:4px;height:4px;border-radius:50%;background:#FF9A2E;box-shadow:0 0 8px 2px #FF7A1A;animation:ember 4s linear infinite}
.bar{background-image:repeating-linear-gradient(-45deg,#FFC21A 0 7px,#E89A00 7px 14px);background-size:28px 100%;animation:stripes .6s linear infinite}
.pop{animation:pop .6s ease-out both}
.blink{animation:blink 1s step-end infinite}
@keyframes twinkle{0%,100%{transform:scale(0) rotate(0deg);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.rays{animation:spin 12s linear infinite}
.tw{position:absolute;animation:twinkle 1.8s ease-in-out infinite}
.float{animation:float 2.6s ease-in-out infinite}
.spk{position:absolute;left:50%;top:52%;width:5px;height:5px;border-radius:50%;animation:spark 1.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-170px) scale(1);opacity:0}}
@keyframes shard{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(14deg)}}
@keyframes halo{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes beam{0%,100%{opacity:.55}50%{opacity:1}}
.rays2{animation:spinr 18s linear infinite}
.mote{position:absolute;width:4px;height:4px;border-radius:50%;background:#FFF6D6;box-shadow:0 0 6px 2px rgba(255,220,120,.9);animation:rise 3.2s linear infinite}
.shard{position:absolute;animation:shard 3s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(120,230,255,.95))}
.halo{position:absolute;left:50%;top:50%;width:280px;height:280px;margin:-140px 0 0 -140px;border-radius:50%;border:2px solid rgba(255,230,150,.8);box-shadow:0 0 18px rgba(255,210,90,.7),inset 0 0 18px rgba(255,210,90,.5);animation:halo 2.4s ease-out infinite}
.beam{animation:beam 2.2s ease-in-out infinite}
.cta{transition:transform .12s ease,filter .12s ease}
.cta:hover{filter:brightness(1.1)}
.cta:active{transform:scale(.97)}
.inp:focus{outline:2px solid #FFC21A;outline-offset:2px}
</style>
</head>

<div class="pulse" aria-hidden="true" style="position: absolute; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(255,154,46,0.35) 0%, rgba(255,154,46,0) 70%)"></div>
<svg width="190" height="190" viewBox="0 0 190 190" aria-hidden="true" style="position: relative">
<g class="spinr"><circle cx="95" cy="95" r="86" fill="none" stroke="#FFC21A" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 10"></circle></g>
<g class="spin"><circle cx="95" cy="95" r="72" fill="none" stroke="#FFC21A" stroke-width="5" stroke-linecap="round" stroke-dasharray="120 332"></circle></g>

</div>

<div style="display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 10;">

<div data-if="claimed" style="display: contents">
<div class="pop" role="status" style="margin-top: 12px; width: 100%; box-sizing: border-box; padding: 10px 14px; border-radius: 6px; background: rgba(61,203,122,0.14); border: 1px solid rgba(61,203,122,0.6); text-align: center; font-size: 16px; font-weight: 700; color: #BDF5D3">Claimed! <span data-t="slicesText"></span> diamonds are on the way!</div>
</div>
<div data-if="notClaimed" style="display: contents">
<p style="margin: 12px 0 0; text-align: center; font-size: 16px; font-weight: 600; line-height: 1.3; color: #CFC6B8">10 diamonds for every hour played. <span style="color: #FFC21A"><span data-t="rank"></span></span></p>
</div>

<div style="flex: 1"></div>
<div data-if="notClaimed" style="display: contents">
<button type="button" id="btnClaim" class="cta" style="width: 100%; height: 56px; border: 0; border-radius: 6px; cursor: pointer; background: linear-gradient(180deg, #FFD23F 0%, #FFB000 100%); color: #1A1003; font-family: 'Russo One', sans-serif; font-style: italic; font-size: 20px; letter-spacing: 1.5px; box-shadow: 0 0 24px rgba(255,176,0,0.45)">CLAIM REWARD</button>
</div>
<div data-if="claimed" style="display: contents">
<button type="button" id="btnAgain" class="cta" style="width: 100%; height: 56px; border: 0; border-radius: 6px; cursor: pointer; background: linear-gradient(180deg, #FFD23F 0%, #FFB000 100%); color: #1A1003; font-family: 'Russo One', sans-serif; font-style: italic; font-size: 20px; letter-spacing: 1.5px; box-shadow: 0 0 24px rgba(255,176,0,0.45)">CHECK ANOTHER ID</button>
</div>
<p style="margin: 10px 0 0; text-align: center; font-size: 13px; font-weight: 600; color: #9A9184">Results are 100% made up · Just for fun</p>
</div>
</div>

</div>
</div>
</div>
<script>
(function () {
  var state = { screen: 'input', id: '', err: '', pct: 0, hours: 0, claimed: false };
  var timer = null;
  var $ = function (id) { return document.getElementById(id); };
  var input = $('pid');

  function calc(id) {
    var h = 2166136261;
    for (var i = 0; i < id.length; i++) { h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
    h = Math.abs(h);
    return 120 + (h % 9880);
  }
  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }

  function vals() {
    var pct = Math.floor(state.pct), hours = state.hours, rank;
    if (hours < 1500) rank = 'Rank: Casual.';
    else if (hours < 6000) rank = 'Rank: Grinder.';
    else if (hours < 13000) rank = 'Rank: No-life legend.';
    else rank = 'Rank: Error 404 human.';
    return {
      showInput: state.screen === 'input',
      showLoading: state.screen === 'loading',
      showResult: state.screen === 'result',
      id: state.id,
      err: state.err,
      pct: pct,
      status: pct < 20 ? 'CONNECTING TO SERVERS' : pct < 45 ? 'COUNTING GAME HOURS' : pct < 70 ? 'MEASURING NO-LIFE LEVEL' : pct < 92 ? 'CHECKING GRASS CONTACT' : 'ALMOST DONE',
      hoursText: fmt(hours),
      slicesText: fmt(hours * 10),
      rank: rank,
      claimed: state.claimed,
      notClaimed: !state.claimed
    };
  }

  function render() {
    var v = vals();
    document.querySelectorAll('[data-if]').forEach(function (el) {
      el.style.display = v[el.getAttribute('data-if')] ? 'contents' : 'none';
    });
    document.querySelectorAll('[data-t]').forEach(function (el) {
      el.textContent = v[el.getAttribute('data-t')];
    });
    $('bar').style.width = v.pct + '%';
    $('ringProg').setAttribute('stroke-dashoffset', (502.65 * (1 - v.pct / 100)).toFixed(1));
    $('pctSvg').textContent = v.pct + '%';
  }
  function set(p) { for (var k in p) state[k] = p[k]; render(); }

  function start() {
    var id = String(input.value || '').replace(/[^0-9]/g, '').slice(0, 12);
    if (id.length < 3) { set({ id: id, err: 'Enter a valid ID (at least 3 digits).' }); return; }
    if (timer) clearInterval(timer);
    set({ id: id, screen: 'loading', pct: 0, err: '', claimed: false });
    timer = setInterval(function () {
      var p = state.pct + Math.random() * 3 + 1.5;
      if (p >= 100) {
        clearInterval(timer); timer = null;
        set({ pct: 100 });
        setTimeout(function () { set({ screen: 'result', hours: calc(id) }); }, 600);
      } else set({ pct: p });
    }, 40);
  }

  input.addEventListener('input', function () {
    var clean = input.value.replace(/[^0-9]/g, '').slice(0, 12);
    if (clean !== input.value) input.value = clean;
    if (state.err) set({ err: '' });
  });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); start(); } });
  $('btnGo').addEventListener('click', start);
  
  $('btnPaste').addEventListener('click', function () {
    // Генерируем случайный 10-значный ID
    var randomId = Math.floor(Math.random() * 9000000000) + 1000000000;
    input.value = String(randomId);
    if (state.err) set({ err: '' });
  });

  $('btnClaim').addEventListener('click', function () { 
    set({ claimed: true }); 
    if (window.confetti) {
      confetti({
        particleCount: 150,
        spread: 80,
        origin: { y: 0.6 },
        colors: ['#FFC21A', '#FF9A2E', '#FFFFFF', '#8FF0FF'],
        zIndex: 9999
      });
    }
  });
  $('btnAgain').addEventListener('click', function () {
    input.value = '';
    set({ screen: 'input', pct: 0, id: '', hours: 0, claimed: false });
  });

  // scale the 390x844 phone layout to fit any screen
  function fit() {
    var k = Math.min(window.innerWidth / 390, window.innerHeight / 844);
    $('app').style.transform = 'scale(' + k + ')';
  }
  window.addEventListener('resize', fit);
  fit();
  render();
})();
</script>
</body>
</html>
